name: Agent Review

# Labeling a PR `agent:review` runs the review agent (pi CLI, ZAI provider via
# env vars) grounded in the PR diff and review context. The label arrives on
# its own in the happy path: the implement workflow applies it to the freshly
# opened draft PR (#19); a maintainer re-adds it by hand only to retry a
# blocked review. The agent emits a
# structured payload; the workflow extracts it (unit-tested extraction, no
# live LLM in tests), posts the findings as a regular PR review on the
# maintainer's review surface, and marks the draft PR ready. Any failure posts
# a reason comment with the workflow-run link and relabels the PR
# `agent:blocked` — consistent with the implement workflow's failure path;
# retrying means re-adding the trigger label.
on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per PR at a time; parallel label events queue instead of racing.
    concurrency:
      group: agent-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      # contents: write covers the cli/cli#8910 workaround: gh pr ready's
      # markPullRequestReadyForReview mutation is refused to the GITHUB_TOKEN
      # with only pull-requests: write. The review job never pushes code; the
      # broader contents scope exists solely for that mutation.
      contents: write
      issues: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Link posted in the blocked-PR comment on failure.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Provider/model config lives here, not in code (user story: tune cost
      # and quality by editing env vars only).
      AGENT_PROVIDER: zai
      AGENT_MODEL: glm-5.3-flash
      # Review identity: used only by the agent run and the posting steps.
      # GitHub refuses a formal review by the PR author, and the pipeline's
      # PRs are authored by AGENT_PAT, so the review agent needs its own
      # identity to post a real gh pr review verdict; without REVIEW_PAT the
      # run falls back to AGENT_PAT/GITHUB_TOKEN and post-review.ts degrades
      # to a PR comment instead of failing. Lifecycle label mutations never
      # ride this variable: they run as the workflow's own token via
      # WORKFLOW_GH_TOKEN and the shared guarded path (shared/labels.ts).
      GH_TOKEN: ${{ secrets.REVIEW_PAT || secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lifecycle label mutations go through the shared guarded path as the
      # workflow token, never a PAT: the job's permissions block guarantees
      # the writes, so a mis-scoped REVIEW_PAT can degrade the review verdict
      # but can never strand a PR in the pipeline (issue #17; found by the
      # live smoke of this PR).
      - name: Transition to in-progress
        env:
          WORKFLOW_GH_TOKEN: ${{ github.token }}
        run: npx -y tsx@^4 .sandcastle/agent-workflows/shared/label-transition.ts --surface pr --number "$PR_NUMBER" --transition start --trigger "agent:review"

      - name: Install pi CLI
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Run review agent and extract payload
        id: review
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # The skip path (closed PR) consumes the trigger label through the
          # shared guarded path — as the workflow token, never the PAT.
          WORKFLOW_GH_TOKEN: ${{ github.token }}
          # fail() records failure_reason.txt here; review-payload.json for
          # the poster lands here too. runner context is step-level only.
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/review/review.ts

      # Skipped when the PR is closed/merged (the review step signals that via
      # its skipped output); a closed PR gets no review and no ready flip.
      - name: Post review findings
        if: steps.review.outputs.skipped != 'true'
        env:
          OUTPUT_DIR: ${{ runner.temp }}
          # Findings must land even when the review identity can't write: the
          # fallback comment runs under the workflow token, whose pull-requests
          # write the permissions block above guarantees.
          FALLBACK_GH_TOKEN: ${{ github.token }}
        run: npx tsx .sandcastle/agent-workflows/review/post-review.ts

      - name: Mark PR ready
        if: steps.review.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pipeline PRs are born draft, but finished interactive work ships
          # ready for review (docs/agents/issue-tracker.md). The ready mutation
          # refuses a non-draft PR, and a failed step here lands the PR in the
          # blocked path — flip drafts only, skip the rest.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" = "true" ]; then
            gh pr ready "$PR_NUMBER"
          else
            echo "PR is not a draft; ready-flip skipped (review already posted above)"
          fi

      # Failure handling: post the reason comment (with the run link) and
      # relabel the PR agent:blocked, removing the trigger label. Runs on
      # cancellation too — the trigger label is already consumed by then, so a
      # cancelled run must not leave the PR label-less and silent. The
      # reporter is dependency-free, so it also runs when npm ci or the agent
      # setup itself failed; a fresh checkout guarantees the script is
      # present. Unlike the implement workflow (issues-triggered, so main is
      # always its own version), this workflow runs from the PR's merge ref —
      # the version-matched reporter lives on the PR head, not on main.
      - name: Checkout for failure reporter
        if: ${{ !success() }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Report failure and relabel as blocked
        if: ${{ !success() }}
        env:
          OUTPUT_DIR: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_GH_TOKEN: ${{ github.token }}
        run: npx -y tsx@^4 .sandcastle/agent-workflows/review/report-failure.ts

      - name: Remove in-progress label
        if: always()
        env:
          WORKFLOW_GH_TOKEN: ${{ github.token }}
        run: npx -y tsx@^4 .sandcastle/agent-workflows/shared/label-transition.ts --surface pr --number "$PR_NUMBER" --transition finish

name: Agent Implement

# Labeling a leaf issue `agent:implement` runs preflight gates (refuse
# sub-issues, PRD-shaped issues, and issues already closed by an open
# collaborator PR), then the implementation agent on an isolated branch, then
# opens a draft PR to main that closes the issue and requests the automated
# review by labeling the PR `agent:review` (the PR→review hop is automatic,
# #19 — Story 5 needs no hand). Any failure posts a reason comment with the
# workflow-run link and relabels the subject `agent:blocked` — on the issue
# until the draft PR exists, on the PR afterwards; retrying means re-adding
# the trigger label named in the blocked comment.
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per issue at a time; parallel label events queue instead of racing.
    concurrency:
      group: agent-implement-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      TARGET_BRANCH: main
      # Link posted in the blocked-issue comment on failure.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Provider/model config lives here, not in code (user story: tune cost
      # and quality by editing env vars only).
      AGENT_PROVIDER: zai
      AGENT_MODEL: glm-5.3-flash
      # PAT-backed on purpose, but only for the steps where the PAT is
      # load-bearing: the draft-PR creation must fire pull_request events (a
      # GITHUB_TOKEN cannot trigger other workflows), and the agent's gh calls
      # are read-only evidence gathering. Lifecycle label mutations override
      # this at the step level — they run as the workflow's own token via
      # WORKFLOW_GH_TOKEN and the shared guarded path (shared/labels.ts),
      # never as the PAT (issue #17).
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates run before any state changes: a refused issue never shows
      # in-progress, it goes straight to blocked via the failure handler.
      - name: Preflight gates
        run: npx tsx .sandcastle/agent-workflows/implement/preflight.ts

      # The trigger label is consumed by the run: retries re-add it (parent
      # issue decision), so a finished or blocked issue carries only the
      # lifecycle label. The mutation goes through the shared guarded path
      # (assertOnlyAgentLabels) as the workflow token, never the PAT.
      - name: Transition to in-progress
        env:
          WORKFLOW_GH_TOKEN: ${{ github.token }}
        run: npx -y tsx@^4 .sandcastle/agent-workflows/shared/label-transition.ts --surface issue --number "$ISSUE_NUMBER" --transition start --trigger "agent:implement"

      - name: Configure agent identity
        run: |
          git config user.name "tenderagent[bot]"
          git config user.email "tenderagent[bot]@users.noreply.github.com"

      - name: Compute branch name
        id: branch
        run: |
          branch=$(npx tsx .sandcastle/agent-workflows/implement/branch.ts)
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create agent branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git checkout -b "$BRANCH"

      - name: Install pi CLI
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Run implementation agent
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          BRANCH: ${{ steps.branch.outputs.name }}
          # Where fail() records failure_reason.txt for the failure handler.
          # runner context is step-level only, so this lives here.
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement/implement.ts

      # Push under the PAT when present, the workflow GITHUB_TOKEN otherwise.
      # The GITHUB_TOKEN can never push commits that create or update
      # .github/workflows/ files — no permissions block grants `workflows` to
      # it, the refusal is server-side (#17's and #18's runs died exactly
      # there) — so workflow-touching issues require AGENT_PAT to carry the
      # fine-grained Workflows read/write permission (classic: the `workflow`
      # scope). Unsetting checkout's stored auth header is what makes the
      # push actually use the token below. The push itself is lease-guarded
      # (implement/push.ts): it reads the remote state with ls-remote and
      # pins it with --force-with-lease, so a retry cannot clobber commits a
      # concurrent run pushed — it fails loudly, with a recorded reason —
      # while a first push (no remote ref) pushes under the empty
      # expectation: the ref must not exist.
      - name: Push branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          PUSH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          # Where the push's fail() records failure_reason.txt for the
          # failure handler below (a bare rejected push used to block the
          # issue with no recorded reason — the #18 blocked comment).
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          git config --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@${GITHUB_SERVER_URL#*://}/${GH_REPO}.git"
          npx tsx .sandcastle/agent-workflows/implement/push.ts

      # The PAT is load-bearing here and only here (besides the agent's gh
      # reads and the review request below): a draft PR opened by the
      # GITHUB_TOKEN fires no pull_request events, so CI and the review
      # workflow would never run. Creating a PR is not a label mutation — the
      # token boundary of issue #17 covers lifecycle run transitions only.
      # The body comes from the resolver (implement/pr-body.ts): the agent's
      # pr-body.md draft — written before the completion signal per the prompt's
      # PR BODY section — when present, the canned stub otherwise. A missing
      # draft is a soft gate: it changes the body, never fails the run, so
      # style never lands in agent:blocked. Either way the body's first line
      # is Closes #<n> (the resolver prepends the keyword to a draft that
      # lacks it), so merging still closes the issue.
      - name: Open draft PR
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          # Same directory the agent wrote its pr-body.md draft to; step-level
          # because the runner context is (see the Run implementation step).
          OUTPUT_DIR: ${{ runner.temp }}
        run: |
          title="Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          title="${title:0:256}"
          body_file=$(npx tsx .sandcastle/agent-workflows/implement/pr-body.ts)
          pr_url=$(gh pr create --draft --base "$TARGET_BRANCH" --head "$BRANCH" --title "$title" --body-file "$body_file")
          echo "$pr_url"
          # Handed to the review request below and to the failure reporter:
          # from this point the work item is the PR, so a later failure
          # reports on the PR (retry by agent:review) instead of the issue.
          echo "IMPLEMENTED_PR_NUMBER=${pr_url##*/}" >> "$GITHUB_ENV"

      # Story 5 fully automatic (#19): the fresh draft PR is labeled
      # agent:review, which fires the Agent Review workflow — the PR→review
      # hop, mirroring the bridge's issue→implement hop. The step-level
      # GH_TOKEN drops the job-level GITHUB_TOKEN fallback on purpose: label
      # events fired by the default token never start other workflow runs, so
      # a silent fallback would leave the PR unlabeled with no review and no
      # failure (the bridge carries the same AGENT_PAT-only rule). This add
      # is a trigger, not a run transition: it deliberately bypasses the
      # guarded lifecycle path (shared/labels.ts), whose workflow-token rule
      # covers transitions and failure relabels; the label string is the
      # shared REVIEW_TRIGGER_LABEL constant, and a missing agent:review repo
      # label is created best-effort first (gh silently no-ops --add-label
      # for a label the repo lacks). Any failure lands on the PR via the
      # failure reporter below, retrying by re-adding agent:review there.
      - name: Request agent review
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: npx tsx .sandcastle/agent-workflows/implement/review-request.ts

      # Failure handling: post the reason comment (with the run link) and
      # relabel the subject agent:blocked, removing the trigger label. The
      # surface follows the work item: on the issue until the draft PR exists
      # (retry by re-adding agent:implement), on the PR afterwards (retry by
      # re-adding agent:review there — re-implementing would be refused by
      # preflight while the PR is open). Runs on cancellation too — the
      # trigger label is already consumed by then, so a cancelled run must
      # not leave the subject label-less and silent. The reporter is
      # dependency-free, so it also runs when npm ci or the agent setup
      # itself failed; a fresh checkout guarantees the script is present.
      - name: Checkout for failure reporter
        if: ${{ !success() }}
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Report failure and relabel as blocked
        if: ${{ !success() }}
        env:
          OUTPUT_DIR: ${{ runner.temp }}
          # The blocked comment and relabel run under the workflow token: the
          # job's permissions block guarantees the writes; the PAT does not.
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_GH_TOKEN: ${{ github.token }}
        run: npx -y tsx@^4 .sandcastle/agent-workflows/shared/report-failure.ts

      - name: Remove in-progress label
        if: always()
        env:
          WORKFLOW_GH_TOKEN: ${{ github.token }}
        run: npx -y tsx@^4 .sandcastle/agent-workflows/shared/label-transition.ts --surface issue --number "$ISSUE_NUMBER" --transition finish
